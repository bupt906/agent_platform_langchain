[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-platform-langchain"
version = "0.1.0"
description = "基于 LangChain/LangGraph 的智能体中台 —— 通用智能 Agent 中间件"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.3.0",
    "langgraph>=1.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20.0",
    "langchain-deepseek>=1.1.0",
    "python-docx>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
agent-chat = "agent_platform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]
# 知识库中台后端（KNOWLEDGE_PROVIDER=omnimind / dual 时需要）。
# kb-sdk 由知识库中台仓库构建发布：cd <kb-repo>/sdk && python -m build
omnimind = [
    "kb-sdk>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # Pyflakes: 未使用的导入、未定义变量等
    "E",    # Pycodestyle 错误
    "W",    # Pycodestyle 警告
    "B",    # Flake8-bugbear: 常见 bug 检测
    "I",    # isort: 导入排序
]
ignore = [
    "E501",  # 行过长（由 line-length 处理）
    "B008",  # 函数参数默认值中调用函数（如 Field(default_factory=...)）
]
